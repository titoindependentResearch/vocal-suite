version: '3.8'

services:
  api-gateway:
    build:
      context: ./services/api-gateway/backend
      dockerfile: Dockerfile
    container_name: vocalsuite-api-gateway
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./services/api-gateway/backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

  vox-kernel:
    build:
      context: ./services/vox-kernel
      dockerfile: Dockerfile
    container_name: vocalsuite-vox-kernel
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./services/vox-kernel/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    restart: always

  coach-agent:
    build:
      context: ./services/coach-agent
      dockerfile: Dockerfile
    container_name: vocalsuite-coach-agent
    env_file:
      - .env
    ports:
      - "8002:8002"
    volumes:
      - ./services/coach-agent/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    restart: always

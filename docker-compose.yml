services:
  api-gateway:
    build:
      context: ./services/api-gateway/backend
      dockerfile: Dockerfile
    container_name: vocalsuite-api-gateway
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./services/api-gateway/backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always